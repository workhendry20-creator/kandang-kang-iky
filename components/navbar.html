<!-- 1. FLOATING PILL NAVBAR -->
<div class="fixed top-4 inset-x-0 z-50 flex justify-center px-4 pointer-events-none"
    x-data="{ mobileMenuOpen: false }">
    <nav
        class="pointer-events-auto flex items-center justify-between gap-4 w-full max-w-6xl md:max-w-7xl px-4 md:px-6 py-2.5 rounded-full bg-[#1E3E2B]/90 backdrop-blur-md border border-white/10 shadow-xl text-white transition-all relative">
        <!-- Logo Kiri -->
        <a href="index.html" class="flex items-center gap-2.5 shrink-0 group">
            <div
                class="w-8 h-8 rounded-full overflow-hidden border border-white/20 bg-white aspect-square shrink-0 shadow-xs">
                <img src="assets/logo.webp" alt="Logo Kandang Kang Iky"
                    class="w-full h-full object-cover transition-transform group-hover:scale-105">
            </div>
            <span class="text-xs sm:text-sm font-bold tracking-wide text-white">
                Kandang Kang Iky
            </span>
        </a>

        <!-- Menu Link Desktop -->
        <div class="hidden md:flex items-center gap-1.5 lg:gap-2" id="desktop-nav-links">
            <a href="index.html"
                class="nav-link px-4 py-1.5 rounded-full text-white/90 hover:text-white hover:bg-white/15 transition-all text-sm">Beranda</a>
            <a href="domba.html"
                class="nav-link px-4 py-1.5 rounded-full text-white/90 hover:text-white hover:bg-white/15 transition-all text-sm">Katalog &amp; Tabungan</a>
            <a href="konsultasi.html"
                class="nav-link px-4 py-1.5 rounded-full text-white/90 hover:text-white hover:bg-white/15 transition-all text-sm">Konsultasi</a>
            <a href="dampak-sosial.html"
                class="nav-link px-4 py-1.5 rounded-full text-white/90 hover:text-white hover:bg-white/15 transition-all text-sm">Dampak Sosial</a>
        </div>

        <!-- Action Buttons Kanan (Track Dombamu & Mobile Toggle) -->
        <div class="flex items-center gap-2 shrink-0">
            <!-- Button Track Dombamu CTA -->
            <a href="tracking.html" id="nav-track-btn"
                class="flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/20 hover:bg-white text-white hover:text-[#1E3E2B] font-medium text-xs md:text-sm transition-all border border-white/20 shadow-sm"
                title="Track Dombamu">
                <svg class="w-3.5 h-3.5 md:w-4 md:h-4 shrink-0" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <span>Track Dombamu</span>
            </a>

            <!-- Mobile Hamburger Button -->
            <button id="mobile-menu-toggle-btn" @click="mobileMenuOpen = !mobileMenuOpen"
                class="md:hidden w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center focus:outline-none transition border border-white/20"
                aria-label="Toggle navigation">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path id="hamburger-icon-bars" x-show="!mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 6h16M4 12h16M4 18h16" />
                    <path id="hamburger-icon-close" x-show="mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Mobile Menu Dropdown Card -->
        <div id="mobile-menu-dropdown" x-show="mobileMenuOpen" @click.away="mobileMenuOpen = false"
            x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0 -translate-y-2 scale-95"
            x-transition:enter-end="opacity-100 translate-y-0 scale-100"
            x-transition:leave="transition ease-in duration-150"
            x-transition:leave-start="opacity-100 translate-y-0 scale-100"
            x-transition:leave-end="opacity-0 -translate-y-2 scale-95"
            class="hidden md:hidden absolute top-full left-0 right-0 mt-2 bg-[#1E3E2B]/95 backdrop-blur-md border border-white/15 rounded-2xl p-4 shadow-xl space-y-1.5 text-xs text-white">
            <a href="index.html" @click="mobileMenuOpen = false"
                class="mobile-nav-link block px-3.5 py-2 rounded-xl text-white/90 hover:bg-white/15 hover:text-white transition text-sm">Beranda</a>
            <a href="domba.html" @click="mobileMenuOpen = false"
                class="mobile-nav-link block px-3.5 py-2 rounded-xl text-white/90 hover:bg-white/15 hover:text-white transition text-sm">Katalog &amp; Tabungan</a>
            <a href="konsultasi.html" @click="mobileMenuOpen = false"
                class="mobile-nav-link block px-3.5 py-2 rounded-xl text-white/90 hover:bg-white/15 hover:text-white transition text-sm">Konsultasi</a>
            <a href="dampak-sosial.html" @click="mobileMenuOpen = false"
                class="mobile-nav-link block px-3.5 py-2 rounded-xl text-white/90 hover:bg-white/15 hover:text-white transition text-sm">Dampak Sosial</a>
            <div class="pt-2 border-t border-white/15">
                <a href="tracking.html" @click="mobileMenuOpen = false" id="mobile-nav-track-btn"
                    class="w-full inline-flex items-center justify-center gap-2 py-2.5 bg-white/20 hover:bg-white text-white hover:text-[#1E3E2B] rounded-xl font-bold text-xs transition border border-white/20 shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <span>Track Dombamu</span>
                </a>
            </div>
        </div>
    </nav>
</div>
